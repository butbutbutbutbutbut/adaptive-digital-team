name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan for generic credential patterns
        run: |
          FAIL=0
          # 已知精确凭据串（base token / bot app_id）不进公开仓：使用本地 pre-commit 钩子检查。
          # CI 只做通用密钥模式扫描（20+ 位，避开测试示例值如 ghp_secret123）
          if grep -rInE "ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}" \
              . --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules 2>/dev/null; then
            echo "::error::疑似密钥泄漏（GitHub PAT / OpenAI key / Slack token / AWS key）"
            FAIL=1
          fi
          exit $FAIL
