name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan for known credential patterns
        run: |
          FAIL=0
          # 已知飞书凭据（防再入：base token / bot app_id）
          for pat in "HZtLbcYpLaTgGvsLoqJcKfPOn9g" "cli_aafd8ec6b5f8dbee"; do
            if grep -rIl "$pat" . --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules 2>/dev/null; then
              echo "::error::发现已知凭据模式: $pat"
              FAIL=1
            fi
          done
          # 通用疑似密钥模式（20+ 位，避开测试示例值如 ghp_secret123）
          if grep -rInE "ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}" \
              . --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules 2>/dev/null; then
            echo "::error::疑似密钥泄漏（GitHub PAT / OpenAI key / Slack token）"
            FAIL=1
          fi
          exit $FAIL
